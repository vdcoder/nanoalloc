name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compare_with:
        description: >-
          Paired benchmark: space-separated git refs (branches, tags or commits)
          to compare this commit with. Empty: no comparison.
        required: false
        default: ""
      compare_scale:
        description: "Paired benchmark: trace scale (1.0 = nanoalloc_bench default)"
        required: false
        default: "1.0"
      compare_iterations:
        description: "Paired benchmark: alternating iterations per workload"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_type }}${{ matrix.sanitize && ' + sanitizers' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cxx: g++, build_type: Debug, sanitize: "" }
          - { compiler: gcc, cxx: g++, build_type: Release, sanitize: "" }
          - { compiler: clang, cxx: clang++, build_type: Debug, sanitize: "" }
          - { compiler: clang, cxx: clang++, build_type: Release, sanitize: "" }
          - { compiler: gcc, cxx: g++, build_type: Debug, sanitize: "address;undefined" }
          - { compiler: clang, cxx: clang++, build_type: Debug, sanitize: "address;undefined" }
          - { compiler: clang, cxx: clang++, build_type: Debug, sanitize: "thread" }
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # libclang-rt-18-dev provides Clang's sanitizer runtimes.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DNANOALLOC_WARNINGS_AS_ERRORS=ON
          "-DNANOALLOC_SANITIZE=${{ matrix.sanitize }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Benchmark (quick)
        if: matrix.build_type == 'Release' && matrix.sanitize == ''
        run: |
          ./build/benchmarks/nanoalloc_bench --quick
          ./build/benchmarks/nanoalloc_mtbench --quick

  linux-shared:
    name: Linux shared library + install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure, build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DNANOALLOC_WARNINGS_AS_ERRORS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --parallel 4
          cmake --install build

  windows:
    name: Windows MSVC ${{ matrix.config }}${{ matrix.sanitize && ' + ASan' || '' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: Debug, sanitize: "" }
          - { config: Release, sanitize: "" }
          - { config: Debug, sanitize: "address" }
    steps:
      - uses: actions/checkout@v4
      # Puts the MSVC tools, including the AddressSanitizer runtime DLLs, on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DNANOALLOC_WARNINGS_AS_ERRORS=ON
          "-DNANOALLOC_SANITIZE=${{ matrix.sanitize }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --parallel 4
      - name: Benchmark (quick)
        if: matrix.config == 'Release'
        run: |
          .\build\benchmarks\Release\nanoalloc_bench.exe --quick
          .\build\benchmarks\Release\nanoalloc_mtbench.exe --quick

  # Manually requested comparison with earlier versions (workflow_dispatch with
  # compare_with). Each reference is built into nanoalloc_paired together with
  # this commit; the two versions alternate iteration by iteration, which
  # cancels most of the speed drift of shared runners.
  paired-benchmark:
    name: Paired benchmark ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.compare_with != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build and compare
        shell: bash
        env:
          REFERENCES: ${{ inputs.compare_with }}
          SCALE: ${{ inputs.compare_scale }}
          ITERATIONS: ${{ inputs.compare_iterations }}
        run: |
          set -euo pipefail
          mkdir -p results
          root="$PWD"
          if [ "$RUNNER_OS" = "Windows" ]; then
            root=$(cygpath -m "$PWD")  # a path native CMake understands
          fi
          for ref in $REFERENCES; do
            commit=$(git -C current rev-parse --verify --quiet "$ref^{commit}" ||
                     git -C current rev-parse --verify "origin/$ref^{commit}")
            name=$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._-' '_')
            git -C current worktree add --detach "../reference-$name" "$commit"
            cmake -S current -B "build-$name" -DCMAKE_BUILD_TYPE=Release \
                  -DNANOALLOC_BUILD_TESTS=OFF -DNANOALLOC_BUILD_EXAMPLES=OFF \
                  -DNANOALLOC_INSTALL=OFF "-DNANOALLOC_REFERENCE_SOURCE_DIR=$root/reference-$name"
            cmake --build "build-$name" --config Release --target nanoalloc_paired --parallel
            if [ "$RUNNER_OS" = "Windows" ]; then
              exe="build-$name/benchmarks/Release/nanoalloc_paired.exe"
            else
              exe="build-$name/benchmarks/nanoalloc_paired"
            fi
            echo "== current $(git -C current rev-parse --short HEAD) vs $ref ($commit)" |
              tee "results/paired-$name.txt"
            "$exe" --scale "$SCALE" --iterations "$ITERATIONS" | tee -a "results/paired-$name.txt"
            last_build="build-$name"
          done
          # Absolute numbers of this commit against the system allocator.
          cmake --build "$last_build" --config Release --target nanoalloc_bench --parallel
          if [ "$RUNNER_OS" = "Windows" ]; then
            bench="$last_build/benchmarks/Release/nanoalloc_bench.exe"
          else
            bench="$last_build/benchmarks/nanoalloc_bench"
          fi
          "$bench" --allocators system,nanoalloc --scale "$SCALE" --csv results/bench.csv |
            tee results/bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paired-benchmark-${{ runner.os }}
          path: results/

